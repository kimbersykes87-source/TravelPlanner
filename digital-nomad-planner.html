<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fionas Kimberinho - Travel Planner</title>
    
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Bebas+Neue&display=swap" rel="stylesheet">

    <!-- App Icons / Favicons -->
    <link rel="icon" type="image/svg+xml" href="assets/app-icons/icon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/app-icons/favicon-32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/app-icons/favicon-16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/app-icons/icon-180.png">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Custom CSS -->
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000000;
            min-height: 100vh;
            color: #f8fafc;
            cursor: url('assets/cursor/normal%20select.cur'), auto;
        }

        body.cursor-busy {
            cursor: url('assets/cursor/busy%20select.ani'), wait;
        }

        input[type="text"],
        input[type="number"],
        input[type="date"],
        input[type="email"],
        input[type="search"],
        textarea {
            cursor: url('assets/cursor/text%20select.ani'), text;
        }

        textarea {
            cursor: url('assets/cursor/handwriting%20select.ani'), text;
        }

        select {
            cursor: url('assets/cursor/alternate%20select.cur'), default;
        }

        #worldMap {
            cursor: url('assets/cursor/move%20select.ani'), grab;
        }

        #worldMap.leaflet-grab,
        .leaflet-grab #worldMap {
            cursor: url('assets/cursor/move%20select.ani'), grab;
        }

        #worldMap.leaflet-dragging,
        .leaflet-dragging #worldMap {
            cursor: url('assets/cursor/precision%20select.ani'), grabbing;
        }

        h1, h2, h3, h4, h5, h6 {
            color: #ffffff !important;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            padding: 20px 0;
            background: transparent;
        }

        /* Title font override: Encorpada Pro when available */
        @font-face {
            font-family: 'Encorpada Pro';
            src: url('/assets/brand/fonts/encorpada-pro/encorpada-pro-regular.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }

        .header h1 {
            display: flex;
            align-items: center;
            font-size: 42px;
            line-height: 42px;
            font-weight: 400;
            margin: 0;
            color: #f8fafc;
            font-family: 'Bebas Neue', 'Inter', system-ui, -apple-system, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        .header h1 img {
            height: 36px;
            width: auto;
            margin-right: 10px;
            vertical-align: middle;
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.8;
            font-weight: 300;
            color: #cbd5e1;
        }

        .config-panel {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .config-row {
            display: flex;
            gap: 20px;
            align-items: center;
            margin-bottom: 15px;
        }

        .config-row label {
            font-weight: 600;
            min-width: 120px;
            color: #e2e8f0;
        }

        .config-row input {
            flex: 1;
            padding: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.05);
            color: #f8fafc;
        }

        .config-row input:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .config-row input::placeholder {
            color: #94a3b8;
        }

        .btn {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            cursor: url('assets/cursor/link%20select.ani'), pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: #2563eb;
            transform: translateY(-2px);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: url('assets/cursor/unavailable%20select.ani'), not-allowed;
            transform: none;
        }

        .status {
            margin-top: 15px;
            font-weight: 500;
        }

        .status.success {
            padding: 10px;
            border-radius: 8px;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            padding: 10px;
            border-radius: 8px;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.loading {
            background: transparent;
            border: none;
            padding: 0;
            margin: 0;
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 2000;
        }
        
        /* Loading States */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .loading-plane {
            width: 96px;
            height: 96px;
            filter: brightness(0) invert(1);
            animation: loading-spin 2.8s linear infinite;
        }

        .loading-text {
            font-size: 16px;
            color: #cbd5e1;
            font-weight: 500;
            text-align: center;
        }

        @keyframes loading-spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .tabs {
            display: flex;
            background: #1a1a1a;
            border-radius: 15px 15px 0 0;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .tab {
            flex: 1;
            padding: 12px 20px;
            text-align: center;
            cursor: url('assets/cursor/link%20select.ani'), pointer;
            background: #1a1a1a;
            border: none;
            font-size: 16px;
            font-weight: 400;
            transition: all 0.3s;
            border-bottom: 3px solid transparent;
            color: #ffffff;
            font-family: 'Bebas Neue', 'Inter', system-ui, -apple-system, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            font-size: 20px;
        }

        .tab img {
            vertical-align: middle;
            width: auto;
            height: 36px;
            margin-right: 6px;
            filter: brightness(0) invert(1);
            display: inline-block;
        }

        .tab:hover {
            background: #2a2a2a;
        }

        .tab.active {
            background: #1a1a1a;
            border-bottom-color: #3b82f6;
            color: #3b82f6;
            font-family: 'Bebas Neue', 'Inter', system-ui, -apple-system, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .tab-content {
            background: transparent;
            border-radius: 0 0 15px 15px;
            padding: 30px;
            min-height: 600px;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .tab-content > h2 {
            font-family: 'Bebas Neue', 'Inter', system-ui, -apple-system, 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 32px;
        }

        .tab-content > h2 img {
            width: 28px;
            height: 28px;
            filter: brightness(0) invert(1);
        }

        .timeline-section h3 {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .timeline-section h3 img {
            width: 24px;
            height: 24px;
            filter: brightness(0) invert(1);
        }

        .tab-content.hidden {
            display: none;
        }

        /* Us Tab Styles */
        .profiles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 30px;
            margin-bottom: 40px;
        }

        .profile-card {
            background: transparent;
            border-radius: 15px;
            padding: 25px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: transform 0.3s;
        }

        .profile-card:hover {
            transform: translateY(-5px);
        }

        .profile-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }

        .profile-pic {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-right: 20px;
            object-fit: cover;
            border: 4px solid rgba(255, 255, 255, 0.2);
        }

        .profile-info h3 {
            font-size: 1.5rem;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .profile-info p {
            color: #cbd5e1;
            font-size: 0.9rem;
        }

        .visa-tracker {
            margin-top: 20px;
        }

        .visa-tracker h4 {
            margin-bottom: 15px;
            color: #ffffff;
            font-size: 1.1rem;
        }

        .visa-item {
            padding: 12px;
            margin: 8px 0;
            border-radius: 8px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-left: 4px solid #3b82f6;
        }

        .visa-item.warning {
            border-left-color: #f59e0b;
        }

        .visa-item.danger {
            border-left-color: #ef4444;
        }

        .visa-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        .visa-name {
            font-weight: 600;
            color: #e2e8f0;
        }

        .visa-days {
            font-weight: 600;
            color: #3b82f6;
        }

        .visa-days.warning {
            color: #f59e0b;
        }

        .visa-days.danger {
            color: #ef4444;
        }

        .visa-reset {
            text-align: right;
        }

        .visa-reset small {
            color: #94a3b8;
            font-size: 0.75rem;
        }

        /* Past Tab Styles */
        .map-container {
            height: 500px;
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        .fullscreen-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 8px 12px;
            cursor: url('assets/cursor/link%20select.ani'), pointer;
            font-size: 16px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .fullscreen-btn:hover {
            background: rgba(255, 255, 255, 1);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .map-container.fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 9999;
            border-radius: 0;
            margin: 0;
        }

        #worldMap {
            height: 100%;
            width: 100%;
            border-radius: 15px;
        }

        .sub-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            background: #1a1a1a;
            border-radius: 10px;
            padding: 5px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .sub-tab {
            flex: 1;
            padding: 10px 20px;
            border: none;
            background: transparent;
            cursor: url('assets/cursor/link%20select.ani'), pointer;
            transition: all 0.3s;
            border-radius: 8px;
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
        }

        .sub-tab:hover {
            background: #2a2a2a;
        }

        .sub-tab.active {
            background: #667eea;
            color: white;
        }

        .sub-tab-content {
            display: block;
        }

        .sub-tab-content.hidden {
            display: none;
        }

        .timeline {
            background: #1a1a1a;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .timeline-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin-bottom: 10px;
            background: #2a2a2a;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            color: white;
        }

        .timeline-item.together {
            border-left-color: #28a745;
        }

        .timeline-item.separate {
            border-left-color: #ffc107;
        }

        .timeline-date {
            font-weight: 600;
            min-width: 100px;
            margin-right: 15px;
        }

        .timeline-content {
            flex: 1;
        }

        .timeline-countries {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .timeline-notes {
            color: #ccc;
            font-size: 0.9rem;
        }

        /* Country tiles styling */
        .country-tile {
            background: #2a2a2a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
        }

        .country-tile:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .kimber-tile {
            border-color: #4A90E2;
        }

        .siona-tile {
            border-color: #E91E63;
        }

        .both-tile {
            border-color: #a855f7;
        }

        .tile-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            gap: 12px;
        }

        .tile-icon {
            font-size: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
        }

        .tile-icon.kimber {
            background: rgba(74, 144, 226, 0.2);
        }

        .tile-icon.siona {
            background: rgba(233, 30, 99, 0.2);
        }

        .tile-icon.both {
            background: rgba(168, 85, 247, 0.2);
        }

        .tile-title {
            font-size: 18px;
            font-weight: 600;
            color: white;
            flex: 1;
        }

        .tile-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255,255,255,0.2);
        }
        .tile-count {
            font-size: 14px;
            color: #ccc;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 12px;
            border-radius: 20px;
        }

        .tile-countries {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .country-tag {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .country-tag:hover {
            transform: scale(1.05);
        }

        .country-tag.kimber {
            background: rgba(74, 144, 226, 0.3);
            border: 1px solid rgba(74, 144, 226, 0.5);
        }

        .country-tag.siona {
            background: rgba(233, 30, 99, 0.3);
            border: 1px solid rgba(233, 30, 99, 0.5);
        }

        .country-tag.both {
            background: rgba(168, 85, 247, 0.3);
            border: 1px solid rgba(168, 85, 247, 0.5);
        }

        .country-flag {
            width: 22px;
            height: 16px;
            border-radius: 3px;
            object-fit: cover;
            box-shadow: 0 0 4px rgba(15, 23, 42, 0.3);
        }

        .timeline-country-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 12px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            font-weight: 500;
            margin-right: 6px;
        }

        .timeline-country-divider {
            color: #94a3b8;
            margin: 0 6px;
            font-weight: 600;
        }

        /* Stats Tiles */
        .stats-tile {
            background: #2a2a2a;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #444;
        }

        .stats-tile h3 {
            margin: 0 0 15px 0;
            color: white;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .stats-tile h3 img {
            width: 24px;
            height: 24px;
            filter: brightness(0) invert(1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: #3a3a3a;
            border-radius: 10px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #ccc;
            font-size: 0.9rem;
        }

        .top-countries-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .top-country-item {
            display: flex;
            align-items: center;
            padding: 10px;
            background: #3a3a3a;
            border-radius: 8px;
        }

        .rank {
            width: 30px;
            height: 30px;
            background: #667eea;
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
        }

        .country-name {
            flex: 1;
            color: white;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .days-count {
            color: #ccc;
            font-size: 0.9rem;
        }

        /* Timeline Sections */
        .timeline-section {
            margin-bottom: 30px;
        }

        .timeline-section h3 {
            margin: 0 0 15px 0;
            color: white;
            font-size: 1.2rem;
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
        }
        /* Present Tab Styles */
        .present-sub-tabs {
            display: flex;
            gap: 10px;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 12px;
            padding: 6px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            margin-bottom: 24px;
        }
        
        .present-sub-tab {
            flex: 1;
            background: transparent;
            border: none;
            color: #cbd5f5;
            padding: 12px 18px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.25s ease;
            cursor: url('assets/cursor/link%20select.ani'), pointer;
        }
        
        .present-sub-tab:hover {
            background: rgba(59, 130, 246, 0.15);
        }

        .present-sub-tab.active {
            background: rgba(59, 130, 246, 0.25);
            color: #ffffff;
            box-shadow: inset 0 0 0 1px rgba(59, 130, 246, 0.4);
        }
        
        .present-sub-tab-content {
            display: none;
        }

        .present-sub-tab-content.active {
            display: block;
        }

        .present-subtitle {
            margin: 8px 0 20px 0;
            color: #94a3b8;
            font-size: 0.95rem;
        }
        
        .to-book-actions {
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .btn.icon-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn.icon-btn .btn-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.15);
            font-size: 16px;
        }

        .btn.secondary {
            background: transparent;
            border: 1px solid rgba(148, 163, 184, 0.4);
            color: #e2e8f0;
        }

        .btn.secondary:hover {
            background: rgba(148, 163, 184, 0.15);
        }

        .btn.tertiary {
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5f5;
        }

        .btn.tertiary:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .btn.ghost {
            background: transparent;
            border: 1px solid transparent;
            color: #94a3b8;
        }

        .btn.ghost:hover {
            border-color: rgba(148, 163, 184, 0.3);
            color: #e2e8f0;
        }

        .to-book-form {
            background: rgba(15, 23, 42, 0.85);
            border-radius: 18px;
            border: 1px solid rgba(148, 163, 184, 0.2);
            padding: 24px;
            margin-bottom: 32px;
            backdrop-filter: blur(6px);
        }

        .to-book-form.hidden {
            display: none;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 18px;
            margin-bottom: 18px;
        }

        .form-field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-field label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
        }

        .form-field input,
        .form-field select,
        .form-field textarea {
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid rgba(148, 163, 184, 0.3);
            background: rgba(15, 23, 42, 0.6);
            color: #f8fafc;
            font-size: 0.95rem;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        function getLocalStorageSafe() {
            try {
                return window && window.localStorage ? window.localStorage : null;
            } catch (error) {
                console.warn('Local storage unavailable:', error?.message || error);
                return null;
            }
        }

        function loadLocalEntries(key) {
            const store = getLocalStorageSafe();
            if (!store) return [];
            try {
                const raw = store.getItem(key);
                if (!raw) return [];
                const parsed = JSON.parse(raw);
                return Array.isArray(parsed) ? parsed : [];
            } catch (error) {
                console.warn('Unable to load local entries for', key, error);
                return [];
            }
        }

        function saveLocalEntries(key, entries) {
            const store = getLocalStorageSafe();
            if (!store) return;
            try {
                store.setItem(key, JSON.stringify(entries));
            } catch (error) {
                console.warn('Unable to persist local entries for', key, error);
            }
        }

        function extractRowKey(row, fieldName) {
            if (!row) return '';
            if (Array.isArray(row)) {
                return row[0] || '';
            }
            return row[fieldName] || row[0] || '';
        }

        function mergeRows(existingRows, localRows, keyName) {
            const map = new Map();
            (Array.isArray(existingRows) ? existingRows : []).forEach(row => {
                const key = extractRowKey(row, keyName);
                if (key) {
                    map.set(key, row);
                }
            });
            (Array.isArray(localRows) ? localRows : []).forEach(row => {
                const key = extractRowKey(row, keyName);
                if (key) {
                    map.set(key, row);
                }
            });
            return Array.from(map.values());
        }

        async function persistToBookRemote(task) {
            if (!task) return { success: false, error: 'No task payload supplied.' };
            if (!isWriteApiConfigured()) {
                return { skipped: true };
            }

            try {
                const payload = new URLSearchParams();
                payload.append('token', WRITE_API_TOKEN);
                payload.append('action', 'upsertToBook');
                payload.append('toBook', JSON.stringify({
                    taskId: task.taskId,
                    assignee: task.assignee,
                    bookingType: task.bookingType,
                    startDate: task.startDate,
                    endDate: task.endDate,
                    instruction: task.instruction,
                    deadline: task.deadline,
                    notes: task.notes,
                    status: task.status || 'pending',
                    createdAt: task.createdAt,
                    updatedAt: task.updatedAt || new Date().toISOString()
                }));

                const response = await fetch(WRITE_API_URL, {
                    method: 'POST',
                    body: payload
                });

                const text = await response.text();
                let data;
                try {
                    data = text ? JSON.parse(text) : {};
                } catch (parseError) {
                    console.warn('Unable to parse To Book write response:', parseError, text);
                    data = { success: false, raw: text };
                }

                if (!response.ok) {
                    return { success: false, status: response.status, data };
                }

                return data;
            } catch (error) {
                console.error('persistToBookRemote error:', error);
                return { success: false, error: error.message || String(error) };
            }
        }

            return WRITE_API_URL && WRITE_API_TOKEN &&

        // Date formatting helpers
        function parseISOToLocalDate(isoDate) {
            if (!isoDate) return null;
            // Robustly parse YYYY-MM-DD without timezone shifts
            if (typeof isoDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(isoDate)) {
                const [y, m, d] = isoDate.split('-').map(Number);
                return new Date(y, m - 1, d);
            }
            if (typeof isoDate === 'string') {
                const match = isoDate.match(/^(\d{4})-(\d{2})-(\d{2})/);
                if (match) {
                    const [, y, m, d] = match;
                    return new Date(Number(y), Number(m) - 1, Number(d));
                }
            }
            const d = new Date(isoDate);
            if (isNaN(d)) return null;
            return d;
        }

        function formatLongDate(isoDate) {
            const d = parseISOToLocalDate(isoDate);
            if (!d) return isoDate || '';
            const weekdays = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
            const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
            return `${weekdays[d.getDay()]} ${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
        }

        function formatDDMMYYYY(isoDate) {
            const d = parseISOToLocalDate(isoDate);
            if (!d) return isoDate || '';
            const dd = String(d.getDate()).padStart(2, '0');
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const yyyy = d.getFullYear();
            return `${dd}-${mm}-${yyyy}`;
        }

        function formatDDMMYY(date) {
            if (!date) return '';
            const d = date instanceof Date ? date : parseISOToLocalDate(date);
            if (!d || isNaN(d.getTime())) return '';
            const dd = String(d.getDate()).padStart(2, '0');
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const yy = String(d.getFullYear()).slice(-2);
            return `${dd}-${mm}-${yy}`;
        }

        async function loadSheetData(spreadsheetId, sheetName) {
            try {
                // Use Google Sheets CSV export URL with CORS proxy
                const baseUrl = `https://docs.google.com/spreadsheets/d/${spreadsheetId}/gviz/tq?tqx=out:csv&sheet=${sheetName}`;
                
                // Try multiple CORS proxy services
                const proxies = [
                    'https://api.allorigins.win/raw?url=',
                    'https://corsproxy.io/?',
                    'https://thingproxy.freeboard.io/fetch/',
                    'https://cors-anywhere.herokuapp.com/',
                    'https://api.codetabs.com/v1/proxy?quest=',
                    'https://cors.eu.org/',
                    'https://proxy.cors.sh/'
                ];
                
                let csvText = '';
                let lastError = null;
                
                for (const proxy of proxies) {
                    try {
                        const url = proxy + encodeURIComponent(baseUrl);
                        console.log(`🔄 Loading ${sheetName} from: ${url}`);
                        
                        const response = await fetch(url);
                        if (!response.ok) {
                            console.log(`❌ Proxy failed: ${proxy} - HTTP ${response.status}`);
                            continue;
                        }
                        
                        csvText = await response.text();
                        console.log(`✅ ${sheetName} loaded: ${csvText.length} characters`);
                        
                        // Check if we got actual data or an error page
                        if (csvText.includes('This browser version is no longer supported') || 
                            csvText.includes('Access denied') || 
                            csvText.includes('CORS') ||
                            csvText.includes('Cross-Origin') ||
                            csvText.length < 100) {
                            console.log(`❌ ${sheetName} returned error page, trying next proxy`);
                            console.log(`❌ Error content preview: ${csvText.substring(0, 200)}`);
                            continue;
                        }
                        
                        // Success!
                        break;
                        
                    } catch (error) {
                        console.log(`❌ Proxy ${proxy} failed:`, error.message);
                        lastError = error;
                        continue;
                    }
                }
                
                if (!csvText) {
                    console.error(`❌ All CORS proxies failed for ${sheetName}`);
                    console.error('Last error:', lastError);
                    
                    // Show user-friendly error message
                    const errorDiv = document.createElement('div');
                    errorDiv.style.cssText = `
                        position: fixed; top: 20px; right: 20px; z-index: 10000;
                        background: #ff4444; color: white; padding: 15px; border-radius: 5px;
                        box-shadow: 0 4px 6px rgba(0,0,0,0.1); max-width: 300px;
                    `;
                    errorDiv.innerHTML = `
                        <strong>CORS Error</strong><br>
                        Unable to load data from Google Sheets.<br>
                        <button onclick="location.reload()" style="margin-top: 10px; padding: 5px 10px; background: white; color: #ff4444; border: none; border-radius: 3px; cursor: url('assets/cursor/link%20select.ani'), pointer;">
                            Retry
                        </button>
                    `;
                    document.body.appendChild(errorDiv);
                    
                    throw new Error(`All proxies failed. Last error: ${lastError?.message || 'Unknown error'}`);
                }
                
                // Debug the first few lines of the CSV
                const lines = csvText.split('\n');
                console.log(`📊 ${sheetName} CSV preview (first 3 lines):`, lines.slice(0, 3));
                
                // Convert CSV to array of arrays
                const data = lines.map(line => {
                    const result = [];
                    let current = '';
                    let inQuotes = false;
                    
                    for (let i = 0; i < line.length; i++) {
                        const char = line[i];
                        
                        if (char === '"') {
                            inQuotes = !inQuotes;
                        } else if (char === ',' && !inQuotes) {
                            result.push(current);
                            current = '';
                        } else {
                            current += char;
                        }
                    }
                    
                    result.push(current);
                    return result;
                });
                
                console.log(`📊 ${sheetName} parsed: ${data.length} rows`);
                return data;
                
            } catch (error) {
                console.error(`❌ Error loading ${sheetName}:`, error);
                throw error;
            }
        }

        // Function to standardize country names to 3-letter codes
        function standardizeCountryName(countryName) {
            if (!countryName) return null;
            
            // First check direct mapping
            const directMatch = countryNameMapping[countryName];
            if (directMatch) return directMatch;
            
            // Check case-insensitive mapping
            const lowerName = countryName.toLowerCase().trim();
            for (const [key, value] of Object.entries(countryNameMapping)) {
                if (key.toLowerCase() === lowerName) {
                    return value;
                }
            }
            
            // If no mapping found, try to find in countries data
            if (currentData.countries) {
                const country = currentData.countries.find(c => {
                    const name = c[0]; // Country name
                    const alpha3 = c[1]; // Alpha3 code
                    return name.toLowerCase() === lowerName || 
                           alpha3.toLowerCase() === lowerName;
                });
                if (country) {
                    return country[1]; // Return Alpha3 code
                }
            }
            
            // Return original name if no standardization found
            console.warn(`No standardization found for country: ${countryName}`);
            return countryName;
        }

        // Function to get proper English name from 3-letter code
        function getProperEnglishName(alpha3Code) {
            if (!currentData.countries) return alpha3Code;
            
            const country = currentData.countries.find(c => c[1] === alpha3Code);
            return country ? country[0] : alpha3Code; // Return proper name or code if not found
        }

        function findCountryEntry(countryInput) {
            if (!currentData.countries || !countryInput) return null;
            const value = (countryInput || '').toString().trim();
            if (!value) return null;

            const countries = currentData.countries;
            const upper = value.toUpperCase();
            const lower = value.toLowerCase();

            let entry = countries.find(row => (row[1] || '').toUpperCase() === upper);
            if (!entry) {
                entry = countries.find(row => (row[2] || '').toUpperCase() === upper);
            }
            if (!entry) {
                entry = countries.find(row => (row[0] || '').toLowerCase() === lower);
            }
            if (!entry) {
                const alpha3 = standardizeCountryName(value);
                if (alpha3 && alpha3.length === 3 && alpha3.toUpperCase() !== upper) {
                    entry = countries.find(row => (row[1] || '').toUpperCase() === alpha3.toUpperCase());
                }
            }
            return entry || null;
        }

        function getCountryDisplay(countryInput) {
            const entry = findCountryEntry(countryInput);
            if (entry) {
                return {
                    name: entry[0] || countryInput || '',
                    alpha3: entry[1] || '',
                    alpha2: entry[2] || '',
                    flag: entry[3] || ''
                };
            }
            return {
                name: countryInput || '',
                alpha3: '',
                alpha2: '',
                flag: ''
            };
        }

        function renderTimelineCountryChip(countryName, roleLabel = '') {

            const safeName = sanitizeText(display.name);
            const flagMarkup = display.flag ? `<img class="country-flag" src="${sanitizeAttribute(display.flag)}" alt="${safeName} flag">` : '';

            return `<span class="timeline-country-chip">${flagMarkup}<span>${safeName}${roleSuffix}</span></span>`;

        function renderTimelineCountries(period) {
            if (!period) return '';
            if (period.type === 'together') {
                const country = period.kimberCountry || period.countries;
                return renderTimelineCountryChip(country);
            }
            const chips = [];
            const kimberCountry = period.kimberCountry || (period.countries?.split('/')?.[0] || '').trim();
            const sionaCountry = period.sionaCountry || (period.countries?.split('/')?.[1] || '').trim();
            const kimberChip = renderTimelineCountryChip(kimberCountry, 'Kimber');
            const sionaChip = renderTimelineCountryChip(sionaCountry, 'Siona');
            if (kimberChip) chips.push(kimberChip);
            if (kimberChip && sionaChip) chips.push('<span class="timeline-country-divider">/</span>');
            if (sionaChip) chips.push(sionaChip);
            return chips.join('');
        }

        }
        function getUKTaxYear(today) {
            // UK tax year runs from 6 April to 5 April
            const currentYear = today.getFullYear();
            const april6Current = new Date(currentYear, 3, 6); // April 6 of current calendar year
            const april6Next = new Date(currentYear + 1, 3, 6); // April 6 of next calendar year
            
            if (today >= april6Current) {

                return {

                    end: new Date(april6Next.getTime() - 1), // April 5 of next year (end of day)
                    resetDate: april6Next
                };
            } else {
                // Current tax year started on April 6 of previous year
                const april6Previous = new Date(currentYear - 1, 3, 6);
                return {
                    start: april6Previous,
                    end: new Date(april6Current.getTime() - 1), // April 5 of current year (end of day)

                const ukWorkDays = taxYearEntries.filter(entry => {

                    const workDay = entry[5]; // SSUKWorkDays
                    return country === 'United Kingdom' && (workDay === 'Yes' || workDay === 'yes' || workDay === 'YES' || workDay === true || workDay === '1');

                // B1/B2 US Visa Tracking

        // Helper function to parse date from RelationshipLog entry
        function parseRelationshipLogDate(dateStr) {
            if (!dateStr) return null;
            try {
                let entryDate;
                if (dateStr.includes('/')) {
                    // DD/MM/YYYY format
                    const parts = dateStr.split('/');
                    entryDate = new Date(parts[2], parts[1] - 1, parts[0]);
                } else if (dateStr.includes('-')) {
                    // YYYY-MM-DD format
                    entryDate = new Date(dateStr);
                } else {
                    return null;
                }
                // Set to start of day for consistent comparison
                entryDate.setHours(0, 0, 0, 0);
                return entryDate;
            } catch (error) {
                console.log('Date parsing error:', dateStr, error);
                return null;
            }
        }

        // Check if country is contiguous territory (Canada or Mexico)
        function isContiguousTerritory(country) {
            return country === 'Canada' || country === 'Mexico';
        }

        // Check if country is US or contiguous territory
        function isUSOrContiguous(country) {
            return country === 'United States' || isContiguousTerritory(country);
        }

        // Calculate days between two dates (inclusive of both dates)
        // Entry day counts as Day 1
        function calculateDaysInclusive(startDate, endDate) {
            if (!startDate || !endDate) return 0;
            const diff = Math.floor((endDate - startDate) / (1000 * 60 * 60 * 24));
            return diff + 1; // +1 because entry day counts as Day 1
        }

        // Detect US admission periods for ESTA
        function detectUSAdmissionPeriods(profileId, relationshipLog, today) {
            if (!relationshipLog || relationshipLog.length === 0) return [];
            
            const countryIndex = profileId === 'kimber' ? 1 : 2;
            const periods = [];
            let currentPeriod = null;
            
            // Sort entries by date
            const sortedEntries = relationshipLog
                .map(entry => ({
                    date: parseRelationshipLogDate(entry[0]),
                    country: entry[countryIndex],
                    rawDate: entry[0]
                }))
                .filter(entry => entry.date !== null)
                .sort((a, b) => a.date - b.date);
            
            for (let i = 0; i < sortedEntries.length; i++) {
                const entry = sortedEntries[i];
                const prevCountry = i > 0 ? sortedEntries[i - 1].country : null;
                const isUSOrContig = isUSOrContiguous(entry.country);
                const wasUSOrContig = prevCountry ? isUSOrContiguous(prevCountry) : false;
                
                // Entry: Transition from non-US/contiguous to US/contiguous
                if (!wasUSOrContig && isUSOrContig) {
                    if (currentPeriod) {
                        // Close previous period
                        periods.push({...currentPeriod, endDate: sortedEntries[i - 1].date});
                    }
                    // Start new admission period
                    currentPeriod = {
                        entryDate: entry.date,
                        entryCountry: entry.country,
                        endDate: null,
                        exitDate: null
                    };
                }
                
                // Exit: Transition from US/contiguous to non-US/contiguous
                // Exit happens on the day they transition, but the last day in US/contiguous is the previous day
                if (wasUSOrContig && !isUSOrContig && currentPeriod) {
                    // The last day in US/contiguous territory is the previous entry's date
                    const lastDayInContiguous = sortedEntries[i - 1].date;
                    currentPeriod.endDate = lastDayInContiguous;
                    currentPeriod.exitDate = entry.date; // Exit date is the day they left (current entry date)
                    periods.push({...currentPeriod});
                    currentPeriod = null;
                }
            }
            
            // If still in an admission period, add it
            if (currentPeriod) {
                currentPeriod.endDate = today;
                periods.push(currentPeriod);
            }
            
            return periods;
        }
        // Calculate days since last entry or exit for ESTA
        // Only uses dates on or before today
        function calculateDaysSinceLastEntryOrExit(profileId, relationshipLog, today) {
            const countryIndex = profileId === 'kimber' ? 1 : 2;
            const todayStart = new Date(today);
            todayStart.setHours(0, 0, 0, 0);
            
            // Filter to only dates on or before today
            const validEntries = relationshipLog
                .map(entry => ({
                    date: parseRelationshipLogDate(entry[0]),
                    country: entry[countryIndex],
                    rawDate: entry[0]
                }))
                .filter(entry => entry.date !== null && entry.date <= todayStart)
                .sort((a, b) => b.date - a.date); // Sort descending (most recent first)
            
            if (validEntries.length === 0) return null;
            
            // Find the most recent entry or exit from US/contiguous territory
            // Look for transitions going backwards in time (most recent first)
            let lastEventDate = null;
            let eventType = null;
            
            // Check if most recent entry is US or non-US
            const mostRecentEntry = validEntries[0];
            const mostRecentIsUS = isUSOrContiguous(mostRecentEntry.country);
            
            // If most recent entry is non-US, look for exit (transition from US to non-US)
            if (!mostRecentIsUS) {
                // Look for the most recent transition from US to non-US
                for (let i = 0; i < validEntries.length - 1; i++) {
                    const currentEntry = validEntries[i];
                    const nextEntry = validEntries[i + 1];
                    const currentIsUS = isUSOrContiguous(currentEntry.country);
                    const nextIsUS = isUSOrContiguous(nextEntry.country);
                    
                    if (!currentIsUS && nextIsUS) {
                        // Found transition from US (nextEntry) to non-US (currentEntry)
                        // Exit date is the last day in US = nextEntry.date
                        lastEventDate = nextEntry.date;
                        eventType = 'exit';
                        break;
                    }
                }
            } else {
                // Most recent entry is US, so we're currently in US
                // Look for the most recent entry date (transition from non-US to US)
                for (let i = 0; i < validEntries.length - 1; i++) {
                    const currentEntry = validEntries[i];
                    const nextEntry = validEntries[i + 1];
                    const currentIsUS = isUSOrContiguous(currentEntry.country);
                    const nextIsUS = isUSOrContiguous(nextEntry.country);
                    
                    if (currentIsUS && !nextIsUS) {
                        // Found transition from non-US (nextEntry) to US (currentEntry)
                        // Entry date is the first day in US = currentEntry.date
                        lastEventDate = currentEntry.date;
                        eventType = 'entry';
                        break;
                    }
                }
                
                // If no transition found, find the earliest US entry in the valid entries
                if (!lastEventDate) {
                    for (let i = validEntries.length - 1; i >= 0; i--) {
                        if (isUSOrContiguous(validEntries[i].country)) {
                            lastEventDate = validEntries[i].date;
                            eventType = 'entry';
                            break;
                        }
                    }
                }
            }
            
            if (!lastEventDate) return null;
            
            // Calculate days since (inclusive: today is day 0 if event was today)
            const eventStart = new Date(lastEventDate);
            eventStart.setHours(0, 0, 0, 0);
            const daysSince = Math.floor((todayStart - eventStart) / (1000 * 60 * 60 * 24));
            
            return { days: daysSince, eventType, eventDate: lastEventDate };
        }

        // Calculate current admission period days for ESTA (including contiguous territory)
        // This counts all days in US + contiguous territory since entry
        function calculateCurrentAdmissionDays(profileId, relationshipLog, today) {
            const periods = detectUSAdmissionPeriods(profileId, relationshipLog, today);
            if (periods.length === 0) return null;
            
            const currentPeriod = periods[periods.length - 1];
            if (currentPeriod.exitDate) return null; // Not currently in an admission period
            
            // Count actual days in RelationshipLog from entry to today (inclusive)
            // Entry day counts as Day 1
            const countryIndex = profileId === 'kimber' ? 1 : 2;
            const todayStart = new Date(today);
            todayStart.setHours(0, 0, 0, 0);
            const periodEntryStart = new Date(currentPeriod.entryDate);
            periodEntryStart.setHours(0, 0, 0, 0);
            
            // Count days in RelationshipLog where country is US or contiguous
            const daysInPeriod = relationshipLog.filter(entry => {
                const entryDate = parseRelationshipLogDate(entry[0]);
                if (!entryDate) return false;
                const entryDateStart = new Date(entryDate);
                entryDateStart.setHours(0, 0, 0, 0);
                return entryDateStart >= periodEntryStart && entryDateStart <= todayStart && isUSOrContiguous(entry[countryIndex]);
            }).length;
            
            const remainingDays = 90 - daysInPeriod;
            
            // Calculate termination date (last day you can be in US)
            // Entry day = Day 1, so Day 90 = entryDate + 89 days
            const terminationDate = new Date(currentPeriod.entryDate);
            terminationDate.setDate(terminationDate.getDate() + 89);
            
            return {
                days: daysInPeriod,
                remaining: remainingDays,
                entryDate: currentPeriod.entryDate,
                entryCountry: currentPeriod.entryCountry,
                terminationDate: terminationDate
            };
        }
        // Calculate upcoming US visit days from future RelationshipLog entries
        // Returns object with days, plannedEntryDate, and plannedExitDate
        function calculateUpcomingUSDays(profileId, relationshipLog, today) {
            if (!relationshipLog || relationshipLog.length === 0) return { days: 0, plannedEntryDate: null, plannedExitDate: null };
            
            const countryIndex = profileId === 'kimber' ? 1 : 2;
            let upcomingDays = 0;
            let inUpcomingPeriod = false;
            let plannedEntryDate = null;
            let plannedExitDate = null;
            
            // Sort entries by date
            const sortedEntries = relationshipLog
                .map(entry => ({
                    date: parseRelationshipLogDate(entry[0]),
                    country: entry[countryIndex],
                    rawDate: entry[0]
                }))
                .filter(entry => entry.date !== null && entry.date > today)
                .sort((a, b) => a.date - b.date);
            
            for (let i = 0; i < sortedEntries.length; i++) {
                const entry = sortedEntries[i];
                const isUSOrContig = isUSOrContiguous(entry.country);
                
                if (isUSOrContig) {
                    if (!inUpcomingPeriod) {
                        inUpcomingPeriod = true;
                        plannedEntryDate = entry.date; // First US/contiguous entry
                    }
                    plannedExitDate = entry.date; // Update exit date (last US/contiguous entry)
                    upcomingDays++;
                } else {
                    if (inUpcomingPeriod) {
                        // Exit from contiguous territory, stop counting
                        break;
                    }
                }
            }
            
            return {
                days: upcomingDays,
                plannedEntryDate: plannedEntryDate,
                plannedExitDate: plannedExitDate
            };
        }

        // Calculate rolling 365-day US days total for B1/B2
        function calculateRolling365USDays(profileId, relationshipLog, today) {
            if (!relationshipLog || relationshipLog.length === 0) return { days: 0, remaining: 180 };
            
            const countryIndex = profileId === 'kimber' ? 1 : 2;
            const yearStart = new Date(today);
            yearStart.setFullYear(yearStart.getFullYear() - 1);
            yearStart.setHours(0, 0, 0, 0);
            
            const usDays = relationshipLog.filter(entry => {
                const entryDate = parseRelationshipLogDate(entry[0]);
                if (!entryDate) return false;
                return entryDate >= yearStart && entryDate <= today && entry[countryIndex] === 'United States';
            }).length;
            
            const remainingDays = 180 - usDays;
            return { days: usDays, remaining: remainingDays };
        }

        // Check if a country is part of Schengen Area
        function isSchengenCountry(country) {
            const schengenCountries = [
                'Austria', 'Belgium', 'Bulgaria', 'Croatia', 'Czech Republic', 'Denmark', 
                'Estonia', 'Finland', 'France', 'Germany', 'Greece', 'Hungary', 'Iceland', 
                'Italy', 'Latvia', 'Liechtenstein', 'Lithuania', 'Luxembourg', 'Malta', 
                'Netherlands', 'Norway', 'Poland', 'Portugal', 'Romania', 'Slovakia', 
                'Slovenia', 'Spain', 'Sweden', 'Switzerland',
                // Microstates (treated as inside for practical stays)
                'Monaco', 'San Marino', 'Vatican City'
            ];
            return schengenCountries.includes(country);
        }

        // Calculate rolling 180-day Schengen days total
        // Returns the Schengen days in the last 180 days from TODAY
        function calculateRolling180SchengenDays(profileId, relationshipLog, today) {
            if (!relationshipLog || relationshipLog.length === 0) {
                return { days: 0, remaining: 90, expirationDate: null };
            }
            
            const countryIndex = profileId === 'kimber' ? 1 : 2;
            const todayStart = new Date(today);
            todayStart.setHours(0, 0, 0, 0);
            
            // Calculate the 180-day window ending today
            const windowStart = new Date(todayStart);
            windowStart.setDate(windowStart.getDate() - 179); // 180 days inclusive (179 days back + today)
            windowStart.setHours(0, 0, 0, 0);
            
            // Get all Schengen entries in the last 180 days
            const schengenEntries = relationshipLog
                .map(entry => ({
                    date: parseRelationshipLogDate(entry[0]),
                    country: entry[countryIndex],
                    rawDate: entry[0]
                }))
                .filter(entry => {
                    if (!entry.date) return false;
                    const entryStart = new Date(entry.date);
                    entryStart.setHours(0, 0, 0, 0);
                    return entryStart >= windowStart && entryStart <= todayStart && isSchengenCountry(entry.country);
                });
            
            const daysInLast180 = schengenEntries.length;
            const remainingDays = 90 - daysInLast180;
            
            // Calculate expiration date: if they continue staying in Schengen, when would they hit 90 days?
            // This is today + remaining days (assuming continuous stay)
            let expirationDate = null;
            if (remainingDays > 0 && remainingDays < 90) {
                expirationDate = new Date(todayStart);
                expirationDate.setDate(expirationDate.getDate() + remainingDays);
            } else if (daysInLast180 >= 90) {
                // Already at or over limit
                expirationDate = todayStart;
            }
            
            // Calculate full refresh date: when will all current Schengen days fall outside the 180-day window?
            // If list is empty, full 90 is available today
            // Otherwise, take the latest (most recent) Schengen day and add 180 days
            let fullRefreshDate = null;
            if (schengenEntries.length === 0) {
                // Full 90 days available today
                fullRefreshDate = new Date(todayStart);
            } else {
                // Find the latest (most recent) Schengen day
                const latestDay = schengenEntries.reduce((latest, entry) => {
                    return entry.date > latest ? entry.date : latest;
                }, schengenEntries[0].date);
                
                const latestDate = new Date(latestDay);
                latestDate.setHours(0, 0, 0, 0);
                fullRefreshDate = new Date(latestDate);
                fullRefreshDate.setDate(fullRefreshDate.getDate() + 180); // 180 days after the latest day
            }
            
            return { 
                days: daysInLast180, 
                remaining: remainingDays,
                expirationDate: expirationDate,
                fullRefreshDate: fullRefreshDate
            };
        }

        // Past Tab Functions
        function loadPastTab() {
            // Load All Time content by default
            switchPastSubTab('all-time');
        }

        function switchPastSubTab(subTabName) {
            // Update sub-tab buttons
            document.querySelectorAll('.sub-tab').forEach(btn => btn.classList.remove('active'));
            const activeButton = document.querySelector(`.sub-tab[onclick*="'${subTabName}'"]`);
            if (activeButton) {
                activeButton.classList.add('active');
            }

            // Hide all sub-tab content
            document.querySelectorAll('.sub-tab-content').forEach(content => content.classList.add('hidden'));

            // Show selected sub-tab content
            switch(subTabName) {
                case 'all-time':
                    document.getElementById('all-time-content').classList.remove('hidden');
                    loadTimeline('combined');
                    break;
                case 'relationship':
                    document.getElementById('relationship-content').classList.remove('hidden');
                    loadTimeline('individual');
                    break;
                case 'map':
                    document.getElementById('map-content').classList.remove('hidden');
                    // Initialize map only when Map tab is selected
                    if (!worldMap) {
                        initializeMap();
                    } else {
                        // Map already exists, just invalidate size in case it was hidden
                        setTimeout(() => {
                            if (worldMap) {
                                worldMap.invalidateSize();
                            }
                        }, 100);
                    }
                    break;
            }
        }

        function initializeMap() {
            if (worldMap) {
                worldMap.remove();
                worldMap = null;
            }

            // Ensure the map container is visible and has proper dimensions
            const mapContainer = document.getElementById('worldMap');
            if (mapContainer) {
                mapContainer.style.height = '500px';
                mapContainer.style.width = '100%';
            }

            // Initialize the map
            worldMap = L.map('worldMap', {
                center: [20, 0],
                zoom: 2,
                zoomControl: true,
                attributionControl: false
            });

            // Add tile layer with English labels (CartoDB Positron)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '',
                maxZoom: 18,
                subdomains: 'abcd',
                ext: 'png'
            }).addTo(worldMap);

            // Add country markers based on travel data
            addTravelMarkers();

            // Force map to resize
            setTimeout(() => {
                if (worldMap) {
                    worldMap.invalidateSize();
                }
            }, 100);
        }
        function addTravelMarkers() {
            if (!worldMap) {

            console.log('Adding travel markers...');

                separately: new Set(),      // Both visited pre-relationship but not together post-relationship (Priority 2)
                kimber: new Set(),          // Kimber only pre-relationship (Priority 3)
                siona: new Set()            // Siona only pre-relationship (Priority 4)

                currentData.statistics.forEach(entry => {
                    // Expected columns: A Country, B Code, C Kimber_Days, D Siona_Days, E Together_Days, F Total_Days, G Rank, H Kimber_Visited, I Siona_Visited, J Together_Visited
                    const [country, countryCode, kimberDays, sionaDays, togetherDays, totalDays, rank, kimberVisited, sionaVisited, togetherVisited] = entry;
                    
                    // Skip header row
                    if (country === 'Country') return;

                    if (!countryKey) return;
                    
                    // Determine visit type based on the data

                        // Together visited (highest priority)
                        visitedCountries.together.add(countryKey);
                        console.log(`Together: ${country} (${countryKey}) - ${togetherDays} days`);
                    } else if (isYes(kimberVisited) && isYes(sionaVisited)) {
                        // Both visited but not together (separately)
                        visitedCountries.separately.add(countryKey);
                        console.log(`Separately: ${country} (${countryKey})`);
                    } else if (isYes(kimberVisited) && !isYes(sionaVisited)) {
                        // Kimber only
                        visitedCountries.kimber.add(countryKey);
                        console.log(`Kimber only: ${country} (${countryKey})`);
                    } else if (isYes(sionaVisited) && !isYes(kimberVisited)) {
                        // Siona only
                        visitedCountries.siona.add(countryKey);
                        console.log(`Siona only: ${country} (${countryKey})`);
                    }
                });
                
                console.log('📊 Final country counts:');
                console.log('Together:', visitedCountries.together.size);
                console.log('Separately:', visitedCountries.separately.size);
                console.log('Kimber only:', visitedCountries.kimber.size);
                console.log('Siona only:', visitedCountries.siona.size);
            }

            // All data processing is now done above using Statistics sheet

        function getVisitTypeLabel(type) {
            const labels = {
                together: 'Together',
                kimber: 'Kimber',
                siona: 'Siona',
                separately: 'Separately',
                preRelationship: 'Pre-Relationship Visit',
                bothVisited: 'Both Visited (Pre 30 Sep 2023)'
            };
            return labels[type] || type;
        }

        async function loadCountryBorders(visitedCountries) {
            // Create a mapping of country names to visit types
            const countryTypes = {};
            Object.entries(visitedCountries).forEach(([type, countries]) => {
                countries.forEach(countryName => {
                    countryTypes[countryName] = type;
                });
            });

            console.log('=== MAP DATA LOADING DEBUG ===');
            console.log('Countries to display:', Object.keys(countryTypes));
            console.log('Country types breakdown:', visitedCountries);
            console.log('Countries sheet data:', currentData.countries ? currentData.countries.length + ' countries loaded' : 'NOT LOADED');
            
            if (currentData.countries && currentData.countries.length > 0) {
                console.log('First few countries from sheet:', currentData.countries.slice(0, 3));
            }
            
            // Show some examples of what's in countryTypes
            console.log('Sample countryTypes entries:', Object.entries(countryTypes).slice(0, 5));
            
            console.log('Loading country borders for', Object.keys(countryTypes).length, 'countries');

            try {
                // Load GeoJSON data
                const response = await fetch('https://raw.githubusercontent.com/holtzy/D3-graph-gallery/master/DATA/world.geojson');
                const geoJsonData = await response.json();

                // Render each country
                let matchedCountries = 0;
                let renderedCountries = 0;
                
                geoJsonData.features.forEach(feature => {
                    const countryName = feature.properties.NAME || feature.properties.name;
                    
                    // Find matching country in our data using standardized codes
                    const country = currentData.countries.find(c => {
                        const name = c[0]; // Proper English name
                        const alpha3 = c[1]; // Alpha3 code
                        const alpha2 = c[2]; // Alpha2 code
                        
                        // Check if this GeoJSON country matches any of our countries
                        return name === countryName || 
                               alpha3 === countryName || 
                               alpha2 === countryName ||
                               (name && standardizeCountryName(name) === standardizeCountryName(countryName)) ||
                               (alpha3 && standardizeCountryName(alpha3) === standardizeCountryName(countryName));
                    });

                    if (country) {
                        matchedCountries++;
                        const [name, alpha3, alpha2, flagUrl] = country;
                        // Use the standardized code to find the visit type
                        const visitType = countryTypes[name] || 
                                         countryTypes[alpha3] || 
                                         countryTypes[alpha2] ||
                                         (name && countryTypes[standardizeCountryName(name)]) ||
                                         (alpha3 && countryTypes[standardizeCountryName(alpha3)]);
                        
                        // Debug logging for first few matches
                        if (matchedCountries <= 5) {
                            console.log(`Match ${matchedCountries}: GeoJSON="${countryName}" -> Sheet="${name}" (${alpha3}) -> visitType="${visitType}"`);
                        }
                        
                        if (visitType) {
                            renderedCountries++;
                            const color = getCountryColor(visitType);
                            const strokeColor = getCountryStrokeColor(visitType);
                            
                            // Debug logging for Netherlands
                            if (alpha3 === 'NLD' || name === 'Netherlands') {
                                console.log(`Netherlands found: name=${name}, alpha3=${alpha3}, visitType=${visitType}, color=${color}`);
                            }
                            
                            // Debug logging for first few countries to see what's happening
                            if (renderedCountries <= 5) {
                                console.log(`Country ${renderedCountries}: name=${name}, alpha3=${alpha3}, visitType=${visitType}, color=${color}`);
                            }
                            
                            // Create GeoJSON layer with proper styling
                            const countryLayer = L.geoJSON(feature, {
                                style: {
                                    fillColor: color,
                                    fillOpacity: 0.6,
                                    color: strokeColor,
                                    weight: 1,
                                    opacity: 0.8
                                }
                            }).addTo(worldMap);

                            countryLayer.bindPopup(`
                                <div style="text-align: center;">
                                    <img src="${flagUrl}" style="width: 30px; height: 20px; margin-bottom: 5px;">
                                    <br><strong>${name}</strong>
                                    <br><small>${getVisitTypeLabel(visitType)}</small>
                                </div>
                            `);
                        }
                    }
                });

                console.log('GeoJSON matching results:');
                console.log('- Matched countries:', matchedCountries);
                console.log('- Rendered countries:', renderedCountries);

                console.log('Country borders loaded successfully');
            } catch (error) {
                console.error('Error loading country borders:', error);
                // Fallback to bounding box approach
                renderCountriesWithBounds(visitedCountries);
            }
        }

                                    <br><small>${getVisitTypeLabel(type)}</small>
                                </div>
                            `);
                        }
                    }
                });
            });

        function processTimelineData(view) {
            // Group consecutive days with same countries
            const periods = [];
            let currentPeriod = null;

            // Filter data up to today's date for relationship log
            const today = new Date();
            today.setHours(23, 59, 59, 999); // End of today
            
            const filteredData = currentData.relationshipLog.filter(entry => {
                const [date, kimberCountry, sionaCountry] = entry;
                const entryDate = parseDate(date);
                return entryDate <= today;
            });

            filteredData.forEach(entry => {
                const [date, kimberCountry, sionaCountry, notes] = entry;
                
                if (view === 'individual') {
                    // Show individual timelines
                    if (kimberCountry && (!currentPeriod || currentPeriod.kimberCountry !== kimberCountry)) {
                        if (currentPeriod) periods.push(currentPeriod);
                        currentPeriod = {
                            startDate: date,
                            endDate: date,
                            kimberCountry: kimberCountry,
                            sionaCountry: sionaCountry,
                            type: kimberCountry === sionaCountry ? 'together' : 'separate',
                            countries: kimberCountry === sionaCountry ? kimberCountry : `${kimberCountry} / ${sionaCountry}`,
                            notes: notes
                        };
                    } else if (currentPeriod && currentPeriod.kimberCountry === kimberCountry) {
                        currentPeriod.endDate = date;
                    }
                } else {
                    // Show combined timeline
                    const countries = kimberCountry === sionaCountry ? kimberCountry : `${kimberCountry} / ${sionaCountry}`;
                    const type = kimberCountry === sionaCountry ? 'together' : 'separate';
                    
                    if (!currentPeriod || currentPeriod.countries !== countries) {
                        if (currentPeriod) periods.push(currentPeriod);
                        currentPeriod = {
                            startDate: date,
                            endDate: date,
                            countries: countries,
                            type: type,
                            notes: notes
                        };
                    } else {
                        currentPeriod.endDate = date;
                    }
                }
            });

            if (currentPeriod) periods.push(currentPeriod);
            return periods.slice(0, 20); // Show last 20 periods
        }

        function calculateCountryCounts() {
            // Use Statistics sheet data if available
            if (currentData.statistics) {
                console.log('📊 Statistics sheet data available:', currentData.statistics.length, 'entries');
                console.log('📊 First few entries:', currentData.statistics.slice(0, 3));
                
                // Count from individual entries (no summary section in new structure)
                let kimberCount = 0;
                let sionaCount = 0;
                let togetherCount = 0;
                
                const kimberCountries = [];
                const sionaCountries = [];
                const togetherCountries = [];
                
                const isYes = (v) => v === 'Yes' || v === 'TRUE' || v === 'True' || v === true || v === 1 || v === '1';
                currentData.statistics.forEach(entry => {
                    // Expected columns: A,B,C,D,E,F,G,H,I,J (H-J are visited flags)
                    const [country, code, kimberDays, sionaDays, togetherDays, totalDays, rank, kimberVisited, sionaVisited, togetherVisited] = entry;
                    if (country === 'Country') return; // Skip header
                    
                    if (isYes(kimberVisited)) {
                        kimberCount++;
                        kimberCountries.push(country);
                    }
                    if (isYes(sionaVisited)) {
                        sionaCount++;
                        sionaCountries.push(country);
                    }
                    if (isYes(togetherVisited)) {
                        togetherCount++;
                        togetherCountries.push(country);
                    }
                });
                
                console.log('📊 Calculated counts from Statistics:', { kimber: kimberCount, siona: sionaCount, together: togetherCount });
                console.log('👨 Kimber countries:', kimberCountries.sort());
                console.log('👩 Siona countries:', sionaCountries.sort());
                console.log('💕 Together countries:', togetherCountries.sort());
                
                // Also check relationship log for together countries
                if (currentData.relationshipLog) {
                    const relationshipTogetherCountries = new Set();
                    currentData.relationshipLog.forEach(entry => {
                        const [date, kimberCountry, sionaCountry] = entry;
                        if (kimberCountry === sionaCountry && kimberCountry) {
                            relationshipTogetherCountries.add(kimberCountry);
                        }
                    });
                    // console.log('💕 Relationship log together countries:', Array.from(relationshipTogetherCountries).sort());
                }
                
                return {
                    kimber: kimberCount,
                    siona: sionaCount,
                    together: togetherCount
                };
            }
            
            // No fallback - Statistics sheet is required
            console.log('❌ Statistics sheet not available - cannot calculate country counts');
            const counts = {
                kimber: 0,
                siona: 0,
                together: 0
            };
            
            console.log('📊 No data available - returning zero counts');
            
            return counts;
