        function calculateTop5RelationshipCountries() {
            console.log('🔍 DEBUG: calculateTop5RelationshipCountries called');
            console.log('🔍 DEBUG: currentData.statistics available:', !!currentData.statistics);
            console.log('🔍 DEBUG: currentData.statistics length:', currentData.statistics?.length || 0);
            
            // Use Statistics sheet data if available
            if (currentData.statistics && currentData.statistics.length > 0) {
                return currentData.statistics
                    .filter(entry => {
                        const [country, code, kimberDays, sionaDays, togetherDays, totalDays, rank, kimberVisited, sionaVisited, togetherVisited] = entry;
                        return country !== 'Country' && togetherVisited === 'Yes' && Number(togetherDays || 0) > 0;
                    })
                    .map(entry => {
                        const [country, code, kimberDays, sionaDays, togetherDays] = entry;
                        return { country: country, days: Number(togetherDays || 0) };
                    })
                    .sort((a, b) => b.days - a.days)
                    .slice(0, 5);
            }
            
            // Fallback to old calculation if Statistics sheet not available
            const countryDays = {};
            const today = new Date();
            today.setHours(23, 59, 59, 999);
            
            if (currentData.relationshipLog) {
                currentData.relationshipLog.forEach(entry => {
                    const [date, kimberCountry, sionaCountry] = entry;
                    const entryDate = parseDate(date);
                    if (entryDate > today) return; // Skip future dates
                    
                    // Only count days when both were in the same country
                    if (kimberCountry === sionaCountry && kimberCountry) {
                        const standardizedCountry = standardizeCountryName(kimberCountry);
                        if (standardizedCountry) {
                            if (!countryDays[standardizedCountry]) {
                                countryDays[standardizedCountry] = 0;
                            }
                            countryDays[standardizedCountry]++;
                        }
                    }
                });
            }

            // Sort by days and get top 5
            return Object.entries(countryDays)
                .sort(([,a], [,b]) => b - a)
                .slice(0, 5)
                .map(([country, days]) => ({ country, days }));
        }

                if (index < 3) {

                }
                
                // Handle different data structures - check if it's the old format (10 columns) or new format (8 columns)
                let country, kimberVisited, sionaVisited, togetherVisited;
                
                if (entry.length >= 10) {
                    // Old format: [country, code, kimberDays, sionaDays, togetherDays, totalDays, rank, kimberVisited, sionaVisited, togetherVisited]
                    [country, , , , , , , kimberVisited, sionaVisited, togetherVisited] = entry;
                } else if (entry.length >= 8) {
                    // New format: [country, code, kimberDays, sionaDays, togetherDays, totalDays, rank, kimberVisited]
                    // sionaVisited and togetherVisited need to be calculated from the data
                    [country, , kimberDaysStr, sionaDaysStr, togetherDaysStr, , , kimberVisited] = entry;
                    
                    // Convert days to numbers (handle empty strings and convert to 0)
                    const kimberDays = parseFloat(kimberDaysStr) || 0;
                    const sionaDays = parseFloat(sionaDaysStr) || 0;
                    const togetherDays = parseFloat(togetherDaysStr) || 0;
                    
                    // Calculate sionaVisited and togetherVisited based on days
                    sionaVisited = (sionaDays > 0) ? 'Yes' : 'No';
                    togetherVisited = (togetherDays > 0) ? 'Yes' : 'No';
                    
                    // Debug for first few entries
                    if (index < 3) {
                        console.log(`📊 Days calculation for ${country}:`, {
                            kimberDays,
                            sionaDays,
                            togetherDays,
                            kimberVisited,
                            sionaVisited,
                            togetherVisited
                        });
                    }
                } else {
                    console.warn(`Unexpected data structure for entry ${index}:`, entry);
                    return;
                }
                
                if (country === 'Country') return; // Skip header
                
                // Debug first few entries
                if (index < 3) {
                    console.log(`🔍 Parsed entry ${index}:`, {
                        country,
                        kimberVisited,
                        sionaVisited,
                        togetherVisited
                    });
                }
                
                // Use country name directly since Statistics sheet contains proper names
                const englishName = country;
                
                // Statistics sheet contains "Yes"/"No" for Together, but "1"/"0"/empty for individual visits
                const kimberVisitedNorm = (kimberVisited === 'Yes' || kimberVisited === '1' || kimberVisited === 1) ? 'Yes' : 'No';
                const sionaVisitedNorm = (sionaVisited === 'Yes' || sionaVisited === '1' || sionaVisited === 1) ? 'Yes' : 'No';
                const togetherVisitedNorm = togetherVisited === 'Yes' ? 'Yes' : 'No';
                
                // Debug for first few entries
                if (index < 3) {
                    console.log(`🎯 Categorizing ${country}:`, {
                        kimberVisitedNorm,
                        sionaVisitedNorm,
                        togetherVisitedNorm
                    });
                }
                
                // Countries Visited Together (Together_Visited = "Yes")
                // This takes priority - if visited together, don't count as individual
                if (togetherVisitedNorm === 'Yes') {
                    togetherCountries.push(englishName);
                }
                // Kimber Countries (Kimber_Visited = "Yes" AND Siona_Visited = "No")
                else if (kimberVisitedNorm === 'Yes' && sionaVisitedNorm === 'No') {
                    kimberCountries.push(englishName);
                }
                // Siona Countries (Kimber_Visited = "No" AND Siona_Visited = "Yes")
                else if (kimberVisitedNorm === 'No' && sionaVisitedNorm === 'Yes') {
                    sionaCountries.push(englishName);

            });
            
            console.log('🏗️ Creating tiles with counts:', {
                together: togetherCountries.length,
                kimber: kimberCountries.length,
                siona: sionaCountries.length

            // Create tiles in the specified order
            
            // Sort lists alphabetically

        function createRelationshipTimeline() {
            console.log('🔄 Creating relationship timeline...');
            console.log('RelationshipLog data available:', currentData.relationshipLog?.length || 0, 'entries');
            
            const container = document.createElement('div');
            container.className = 'timeline-section';
            
            const header = document.createElement('h3');
            header.innerHTML = '<img src="assets/icons/passport.svg" alt="Passport">Relationship Timeline';
            header.style.color = 'white';
            header.style.marginBottom = '15px';
            header.style.display = 'flex';
            header.style.alignItems = 'center';
            header.style.gap = '10px';
            container.appendChild(header);
            
            // Get relationship log data from present day back to Sep 30, 2023
            const relationshipData = getRelationshipTimelineData();
            console.log('📊 Processed relationship data:', relationshipData.length, 'periods');
            
            if (relationshipData.length === 0) {
                const noDataMsg = document.createElement('div');
                noDataMsg.textContent = 'No relationship data found for the selected period.';
                noDataMsg.style.color = '#ccc';
                noDataMsg.style.textAlign = 'center';
                noDataMsg.style.padding = '20px';
                container.appendChild(noDataMsg);
                return container;
            }
            
            // Split periods that span across years and group by year
            const periodsByYear = {};
            
            relationshipData.forEach(period => {
                const startDate = parseDate(period.startDate);
                const endDate = parseDate(period.endDate);
                
                if (!startDate || !endDate) {
                    console.error('Invalid date parsing for period:', period);
                    return;
                }
                
                const startYear = startDate.getFullYear();
                const endYear = endDate.getFullYear();
                
                if (startYear === endYear) {
                    // Period is within a single year
                    if (!periodsByYear[startYear]) {
                        periodsByYear[startYear] = [];
                    }
                    periodsByYear[startYear].push(period);
                } else {
                    // Period spans across years - split it
                    let currentYear = startYear;
                    
                    while (currentYear <= endYear) {
                        const splitPeriod = {
                            startDate: currentYear === startYear ? period.startDate : `${currentYear}-01-01`,
                            endDate: currentYear === endYear ? period.endDate : `${currentYear}-12-31`,
                            countries: period.countries,
                            type: period.type,
                            notes: period.notes
                        };
                        
                        if (!periodsByYear[currentYear]) {
                            periodsByYear[currentYear] = [];
                        }
                        periodsByYear[currentYear].push(splitPeriod);
                        
                        currentYear++;
                    }
                }
            });
            
            // Create year sections with expandable dropdowns
            const years = Object.keys(periodsByYear).sort((a, b) => b - a); // Most recent first
            
            years.forEach(year => {
                const yearSection = document.createElement('div');
                yearSection.className = 'year-section';
                
                const yearHeader = document.createElement('div');
                yearHeader.className = 'year-header';
                yearHeader.innerHTML = `
                    <h4>📅 ${year} (${periodsByYear[year].length} periods)</h4>
                    <span class="year-toggle">▼</span>
                `;
                yearHeader.style.cursor = 'pointer';
                yearHeader.style.padding = '10px';
                yearHeader.style.backgroundColor = 'rgba(255, 255, 255, 0.1)';
                yearHeader.style.borderRadius = '8px';
                yearHeader.style.marginBottom = '10px';
                yearHeader.style.display = 'flex';
                yearHeader.style.justifyContent = 'space-between';
                yearHeader.style.alignItems = 'center';
                yearHeader.style.color = 'white';
                
                const yearContent = document.createElement('div');
                yearContent.className = 'year-content';
                yearContent.style.display = 'none';
                yearContent.style.paddingLeft = '20px';
                
                // Add periods for this year (sort newest first within year)
                const yearPeriods = periodsByYear[year].sort((a, b) => {
                    const dateA = parseDate(a.startDate);
                    const dateB = parseDate(b.startDate);
                    return dateB - dateA; // Newest first within year
                });
                
                yearPeriods.forEach(period => {
                    const timelineItem = document.createElement('div');
                    timelineItem.className = `timeline-item ${period.type}`;
                    timelineItem.style.marginBottom = '10px';
                    timelineItem.style.padding = '10px';
                    timelineItem.style.backgroundColor = 'rgba(255, 255, 255, 0.05)';
                    timelineItem.style.borderRadius = '6px';
                    timelineItem.style.borderLeft = period.type === 'together' ? '4px solid #4CAF50' : '4px solid #FF9800';
                    
                    // Format date display - show "Present" for current period
                    const today = new Date();
                    const todayStr = today.toISOString().split('T')[0]; // Get YYYY-MM-DD format
                    const endDateDisplay = period.endDate === todayStr ? 'Present' : period.endDate;
                    
                    // Calculate number of days
                    let daysCount = 1; // Default to 1 day for same start/end date
                    if (period.startDate !== period.endDate) {
                        const startDate = parseDate(period.startDate);
                        const endDate = parseDate(period.endDate);
                        if (startDate && endDate) {
                            const timeDiff = endDate.getTime() - startDate.getTime();
                            daysCount = Math.ceil(timeDiff / (1000 * 3600 * 24)) + 1; // +1 to include both start and end days
                        }
                    }
                    
                    const countriesMarkup = renderTimelineCountries(period) || sanitizeText(period.countries || '');
                    const notesMarkup = period.notes ? sanitizeText(period.notes) : '';

                    timelineItem.innerHTML = `
                        <div style="display: flex; align-items: flex-start; margin-bottom: 5px;">
                            <div class="timeline-date" style="color: #ccc; font-size: 0.9em; font-family: 'Courier New', monospace; min-width: 200px; margin-right: 15px; flex-shrink: 0;">
                                <div>${period.startDate} - ${endDateDisplay}</div>
                                <div style="font-size: 0.8em; color: #999; margin-top: 2px;">${daysCount} day${daysCount !== 1 ? 's' : ''}</div>
                            </div>
                            <div style="flex: 1;">
                                <div class="timeline-countries" style="color: white; font-weight: bold; margin-bottom: 3px; display:flex; flex-wrap: wrap; gap:8px;">${countriesMarkup}</div>
                                <div class="timeline-notes" style="color: #ccc; font-size: 0.9em;">${notesMarkup}</div>
                            </div>
                        </div>
                    `;
                    
                    yearContent.appendChild(timelineItem);
                });
                
                // Toggle functionality
                yearHeader.addEventListener('click', () => {
                    const isExpanded = yearContent.style.display !== 'none';
                    yearContent.style.display = isExpanded ? 'none' : 'block';
                    yearHeader.querySelector('.year-toggle').textContent = isExpanded ? '▼' : '▲';
                });
                
                yearSection.appendChild(yearHeader);
                yearSection.appendChild(yearContent);
                container.appendChild(yearSection);
            });
            
            return container;
        }

        function getRelationshipTimelineData() {
            console.log('🔄 Getting relationship timeline data...');
            console.log('Raw relationshipLog data:', currentData.relationshipLog?.slice(0, 3));
            
            const periods = [];
            let currentPeriod = null;
            
            // Filter data from Sep 30, 2023 onwards up to today (exclude future dates)
            const startDate = new Date('2023-09-30');
            const today = new Date();
            today.setHours(23,59,59,999);
            
            console.log('Filtering data from', startDate.toDateString(), 'to today');
            
            const filteredData = currentData.relationshipLog.filter(entry => {
                const [date, kimberCountry, sionaCountry] = entry;
                const entryDate = parseDate(date);
                return entryDate >= startDate && entryDate <= today;
            });
            
            console.log('Filtered data:', filteredData.length, 'entries');
            console.log('Sample filtered entries:', filteredData.slice(0, 3));
            
            // Sort by date (oldest first for proper grouping)
            filteredData.sort((a, b) => parseDate(a[0]) - parseDate(b[0]));
            
            filteredData.forEach(entry => {
                const [date, kimberCountry, sionaCountry, notes] = entry;
                
                const countries = kimberCountry === sionaCountry ? kimberCountry : `${kimberCountry} / ${sionaCountry}`;
                const type = kimberCountry === sionaCountry ? 'together' : 'separate';
                
                if (!currentPeriod || currentPeriod.countries !== countries) {
                    if (currentPeriod) periods.push(currentPeriod);
                    currentPeriod = {
                        startDate: date,
                        endDate: date,
                        countries: countries,
                        type: type,
                        notes: notes
                    };
                } else {
                    currentPeriod.endDate = date;
                }
            });
            
            if (currentPeriod) periods.push(currentPeriod);
            return periods; // Show all periods
        }

        function setSelectValueWithFallback(selectElement, value) {
            if (!selectElement) return;
            const valueToSet = value || '';

            if (!valueToSet) {
                if (selectElement.options.length > 0) {
                    selectElement.selectedIndex = 0;
                }
                return;
            }

            const hasOption = Array.from(selectElement.options).some(opt => opt.value === valueToSet);
            if (!hasOption) {
                const tempOption = document.createElement('option');
                tempOption.value = valueToSet;
                tempOption.textContent = valueToSet;
                tempOption.setAttribute('data-temp-option', 'true');
                selectElement.appendChild(tempOption);
            }

            selectElement.value = valueToSet;
        }

        async function saveToBookTask() {
            const assignee = document.getElementById('toBookAssignee')?.value || '';
            const bookingType = document.getElementById('toBookType')?.value || '';
            const startDate = document.getElementById('toBookStartDate')?.value || '';
            const endDate = document.getElementById('toBookEndDate')?.value || '';
            const instruction = document.getElementById('toBookInstruction')?.value?.trim() || '';
            const deadline = document.getElementById('toBookDeadline')?.value || '';
            const notes = document.getElementById('toBookNotes')?.value?.trim() || '';
            const isEditing = Boolean(currentEditingToBookId);
            let targetTaskIndex = null;
            let targetTask = null;
            let currentStatus = 'pending';

            if (!assignee || !bookingType || !instruction || !startDate || !deadline) {
                showStatus('Please fill the required fields (assignee, type, instruction, start date, deadline).', 'error');
                return;
            }

            const nowIso = new Date().toISOString();
            let baseMessage = isEditing ? 'Booking request updated.' : 'Booking request added to your To Book list.';
            let messageType = 'success';

            if (isEditing) {
                const { index, row } = findToBookTask(currentEditingToBookId);
                if (index === -1 || !row) {
                    showStatus('Unable to locate that booking request for updating.', 'error');
                    resetToBookFormState();
                    return;
                }

                if (Array.isArray(row)) {
                    row[1] = assignee;
                    row[2] = bookingType;
                    row[3] = startDate;
                    row[4] = endDate;
                    row[5] = instruction;
                    row[6] = deadline;
                    row[7] = notes;
                    row[10] = nowIso;
                    currentStatus = row[8] || 'pending';
                    currentData.toBookTasks[index] = row;
                } else {
                    row.assignee = assignee;
                    row.bookingType = bookingType;
                    row.startDate = startDate;
                    row.endDate = endDate;
                    row.instruction = instruction;
                    row.deadline = deadline;
                    row.notes = notes;
                    row.updatedAt = nowIso;
                    currentStatus = row.status || 'pending';
                    currentData.toBookTasks[index] = row;
                }

                persistLocalToBook();
                targetTaskIndex = index;
                targetTask = normalizeToBookRow(currentData.toBookTasks[index]);
            } else {
                const taskId = `TB-${Date.now().toString().slice(-6)}`;
                const newRow = {
                    taskId,
                    assignee,
                    bookingType,
                    startDate,
                    endDate,
                    instruction,
                    deadline,
                    notes,
                    status: 'pending',
                    createdAt: nowIso,
                    updatedAt: nowIso,
                    __local: true
                };

                if (!Array.isArray(currentData.toBookTasks)) {
                    currentData.toBookTasks = [];
                }
                currentData.toBookTasks.push(newRow);
                persistLocalToBook();

                targetTaskIndex = currentData.toBookTasks.length - 1;
                targetTask = normalizeToBookRow(currentData.toBookTasks[targetTaskIndex]);
                currentStatus = targetTask.status || 'pending';
            }

            renderToBookBoard();
            toggleToBookForm(false);

            const todayIso = new Date().toISOString().split('T')[0];
            if (document.getElementById('toBookStartDate')) document.getElementById('toBookStartDate').value = todayIso;
            if (document.getElementById('toBookEndDate')) document.getElementById('toBookEndDate').value = '';
            if (document.getElementById('toBookDeadline')) document.getElementById('toBookDeadline').value = todayIso;
            if (document.getElementById('toBookInstruction')) document.getElementById('toBookInstruction').value = '';
            if (document.getElementById('toBookNotes')) document.getElementById('toBookNotes').value = '';

            if (targetTaskIndex === null || !targetTask) {
                showStatus(baseMessage, messageType);
                return;
            }

            targetTask.status = currentStatus;

            try {
                const syncResult = await persistToBookRemote(targetTask);
                if (syncResult?.success && syncResult.toBook) {
                    const normalized = syncResult.toBook;
                    currentData.toBookTasks[targetTaskIndex] = {
                        taskId: normalized.taskId,
                        assignee: normalized.assignee,
                        bookingType: normalized.bookingType,
                        startDate: normalizeDateInput(normalized.startDate),
                        endDate: normalizeDateInput(normalized.endDate),
                        instruction: normalized.instruction,
                        deadline: normalizeDateInput(normalized.deadline),
                        notes: normalized.notes,
                        status: normalized.status || 'pending',
                        createdAt: normalized.createdAt,
                        updatedAt: normalized.updatedAt,
                        __local: false
                    };
                    persistLocalToBook();
                    renderToBookBoard();
                    baseMessage = isEditing ? 'Booking request updated.' : 'Booking request added to your To Book list.';
                    messageType = 'success';
                } else if (syncResult?.skipped) {
                    baseMessage = isEditing
                        ? 'Booking request updated locally. Configure the write endpoint to sync with Sheets.'
                        : 'Booking request added locally. Configure the write endpoint to sync with Sheets.';
                    messageType = 'success';
                } else {
                    console.warn('To Book sync failed:', syncResult);
                    baseMessage = 'Booking request saved locally; sync failed. Try again later.';
                    messageType = 'error';
                }
            } catch (error) {
                console.error('To Book sync error:', error);
                baseMessage = 'Booking request saved locally; sync failed. Try again later.';
                messageType = 'error';
            }

            showStatus(baseMessage, messageType);
        }

        function renderToBookBoard() {
            const columns = {
                'Kimber': {
                    list: document.getElementById('kimberToBookList'),
                    count: document.getElementById('kimberToBookCount')
                },
                'Siona': {
                    list: document.getElementById('sionaToBookList'),
                    count: document.getElementById('sionaToBookCount')
                }
            };

            const tasks = getToBookTasks();
            Object.entries(columns).forEach(([assignee, elements]) => {
                const { list, count } = elements;
                if (!list) return;

                const assigneeTasks = tasks.filter(task => task.assignee.toLowerCase() === assignee.toLowerCase());
                assigneeTasks.sort(compareByDeadlineThenCreated);

                if (count) {
                    count.textContent = assigneeTasks.length === 1 ? '1 task' : `${assigneeTasks.length} tasks`;
                }

                if (assigneeTasks.length === 0) {
                    list.innerHTML = `<div class="present-empty-state">No tasks assigned to ${assignee} yet.</div>`;
                    return;
                }

                list.innerHTML = assigneeTasks.map(task => buildToBookCard(task)).join('');
            });
        }
        function buildToBookCard(task) {
            const deadlineInfo = getDeadlineInfo(task.deadline);

            const notesBlock = task.notes ? `<div class="notes">${formatMultilineText(task.notes)}</div>` : '';
            const iconUrl = getBookingIconUrl(task.bookingType);
            const bookingLabel = sanitizeText(task.bookingType || 'Booking');
            const typeBadgeContent = iconUrl
                ? `<img src="${iconUrl}" alt="${bookingLabel} icon">${bookingLabel}`
                : bookingLabel;

            return `
                <div class="to-book-card ${deadlineInfo.isOverdue ? 'overdue' : ''}" data-task-id="${task.taskId}">
                    <div class="card-header">
                        <span class="type-badge">${typeBadgeContent}</span>
                        <span class="deadline-badge ${deadlineInfo.badgeClass}">${deadlineInfo.label}</span>
                    </div>
                    <div class="card-body">${instructionHtml}</div>
                    <div class="card-meta">
                        <div><strong>Start:</strong> ${task.startDate ? sanitizeText(formatDDMMYY(task.startDate)) : 'TBC'}</div>
                        <div><strong>End:</strong> ${task.endDate ? sanitizeText(formatDDMMYY(task.endDate)) : '—'}</div>
                        <div><strong>Deadline:</strong> ${sanitizeText(deadlineInfo.dateLabel)}</div>
                    </div>
                    ${notesBlock}
                    <div class="card-actions">
                        <button class="btn" type="button" onclick="openConvertToBooked('${task.taskId}')">Move to Booked</button>
                        <button class="btn secondary" type="button" onclick="editToBookTask('${task.taskId}')">Edit</button>
                        <button class="btn ghost" type="button" onclick="archiveToBookTask('${task.taskId}')">Archive</button>
                    </div>
                </div>
            `;
        }
        function getDeadlineInfo(deadline) {
            if (!deadline) {
                return {
                    label: 'No deadline',
                    dateLabel: '—',
                    badgeClass: '',
                    isOverdue: false
                };
            }

            const date = parseISOToLocalDate(deadline);
            if (!date) {
                return {
                    label: 'No deadline',
                    dateLabel: '—',
                    badgeClass: '',
                    isOverdue: false
                };
            }

            const today = getTodayStart();
            const diffDays = Math.floor((date - today) / (1000 * 60 * 60 * 24));

            let badgeClass = '';
            let isOverdue = false;
            let label;

            if (diffDays < 0) {
                label = `Overdue ${Math.abs(diffDays)}d`;
                badgeClass = 'overdue';
                isOverdue = true;
            } else if (diffDays === 0) {
                label = 'Due today';
                badgeClass = 'overdue';
                isOverdue = true;
            } else if (diffDays <= 3) {
                label = `Due in ${diffDays}d`;
                badgeClass = 'upcoming';
            } else {
                label = `Due ${formatDDMMYY(deadline)}`;
            }

            return {
                label,
                dateLabel: formatLongDate(deadline),
                badgeClass,
                isOverdue
            };
        }

        function ensureCalendarTooltip() {

        }

        function attachCalendarTooltipHandlers() {
            const tooltip = ensureCalendarTooltip();
            const icons = document.querySelectorAll('.calendar-booking-icon');
            icons.forEach(icon => {
                if (icon._tooltipBound) return;
                icon._tooltipBound = true;

                const show = (event) => {
                    const text = icon.dataset.tooltip || '';
                    const normalized = text.replace(/&#10;/g, '\n');
                    tooltip.textContent = normalized;
                    tooltip.classList.add('visible');
                    positionTooltip(event);
                };

                const hide = () => {
                    tooltip.classList.remove('visible');
                };

                const positionTooltip = (event) => {
                    const tooltipRect = tooltip.getBoundingClientRect();
                    const offset = 12;
                    let x = event.clientX + offset;
                    let y = event.clientY + offset;

                    if (x + tooltipRect.width > window.innerWidth - 10) {
                        x = window.innerWidth - tooltipRect.width - 10;
                    }
                    if (y + tooltipRect.height > window.innerHeight - 10) {
                        y = event.clientY - tooltipRect.height - offset;
                    }

                    tooltip.style.left = `${x}px`;
                    tooltip.style.top = `${y}px`;
                };

                icon.addEventListener('mouseenter', show);
                icon.addEventListener('mousemove', positionTooltip);
                icon.addEventListener('mouseleave', hide);
                icon.addEventListener('touchstart', (event) => {
                    const touch = event.touches[0];
                    const text = icon.dataset.tooltip || '';
                    tooltip.textContent = text.replace(/&#10;/g, '\n');
                    tooltip.classList.add('visible');
                    positionTooltip(touch);
                }, { passive: true });
                icon.addEventListener('touchmove', (event) => {
                    positionTooltip(event.touches[0]);
                }, { passive: true });
                icon.addEventListener('touchend', hide);
            });
        }

        function getBookingIndicatorsForDate(date) {
            const bookings = getBookedEntries({ includePast: true });
            if (!bookings.length) return '';

            const iso = date.toISOString().split('T')[0];
            const matches = bookings.filter(booking => {
                if (!isDateWithinRange(iso, booking.startDate, booking.endDate)) return false;

                const type = (booking.bookingType || '').toLowerCase();
                const startIso = booking.startDate ? booking.startDate.split('T')[0] : '';
                const endIso = booking.endDate ? booking.endDate.split('T')[0] : '';

                if (['flight', 'flight/s', 'flights'].includes(type) && startIso && endIso && startIso !== endIso) {
                    return iso === startIso || iso === endIso;
                }

                return true;
            });

            if (matches.length === 0) return '';

            const badges = matches.slice(0, 3).map(booking => {
                const iconInfo = getCalendarIconInfo(booking);
                const tooltip = sanitizeAttribute(buildBookingTooltipContent(booking));
                const iconPath = iconInfo.icon.replace(/'/g, "\\'");
                const color = sanitizeAttribute(iconInfo.color || '#bfdbfe');
                return `<span class="calendar-booking-icon" data-tooltip="${tooltip}" style="background-color:${color};-webkit-mask:url('${iconPath}') center/contain no-repeat;mask:url('${iconPath}') center/contain no-repeat;"></span>`;
            }).join('');

            return `<div class="calendar-bookings">${badges}</div>`;
        }

        function buildBookingTooltipContent(booking) {
            const headline = booking.headline || booking.bookingType || 'Booking';
            return headline.toString();
        }

        function getBookedEntries(options = {}) {
            const { includePast = false } = options;
            const entries = (currentData.bookedUpcoming || [])
                .map(normalizeBookedRow)
                .filter(Boolean);

            if (entries.length === 0 && Array.isArray(currentData.presentBookings) && currentData.presentBookings.length > 0) {
                entries.push(...currentData.presentBookings.map(normalizeLegacyPresentBooking).filter(Boolean));
            }

            entries.sort(compareByStartDate);

            if (includePast) {
                return entries;
            }

            const cutoffDate = getTodayStart();
            cutoffDate.setDate(cutoffDate.getDate() - 2);
            const cutoffValue = cutoffDate.getTime();

            return entries.filter(entry => {
                const endValue = parseDateValue(entry.endDate || entry.startDate);
                if (isFinite(endValue) && endValue < cutoffValue) {
                    return false;
                }
                return true;
            });
        }

        function normalizeBookedRow(row) {

                    notes: row[8] || '',
                    createdFromTask: row[9] || '',
                    createdAt: row[10] || '',

            }

            return {
                bookingId: row.bookingId || '',
                bookingType: row.bookingType || '',
                headline: row.headline || '',
                details: row.details || '',
                startDate: normalizeDateInput(row.startDate),
                endDate: normalizeDateInput(row.endDate) || normalizeDateInput(row.startDate) || '',
                travellers: row.travellers || '',
                confirmationData: row.confirmationData || '',
                notes: row.notes || '',
                createdFromTask: row.createdFromTask || '',
                createdAt: row.createdAt || '',
                updatedAt: row.updatedAt || ''
            };
        }
        function normalizeLegacyPresentBooking(row) {
            if (!Array.isArray(row)) return null;
            return {
                bookingId: row[0] || '',
                bookingType: row[2] || row[1] || '',
                headline: `${row[2] || ''} ${row[3] || ''}`.trim(),
                details: row[8] || '',
                startDate: normalizeDateInput(row[4]),
                endDate: normalizeDateInput(row[5]) || normalizeDateInput(row[4]) || '',
                travellers: row[1] || '',
                confirmationData: '',
                notes: row[9] || '',
                createdFromTask: '',
                createdAt: '',
                updatedAt: ''
            };
        }
        function renderBookedList() {
            const timeline = document.getElementById('bookedTimeline');
            if (!timeline) return;

            const bookings = getBookedEntries();
            if (bookings.length === 0) {
                timeline.innerHTML = '<div class="present-empty-state">No upcoming bookings yet. Move requests across from "To Book" when you confirm them.</div>';
                return;
            }

            timeline.innerHTML = bookings.map(buildBookedCard).join('');
        }

        function buildBookedCard(booking) {
            const meta = getBookingMeta(booking.bookingType);
            const accent = meta?.accentColor || 'rgba(59, 130, 246, 0.6)';
            const emoji = getBookingEmoji(booking.bookingType);
            const iconUrl = getBookingIconUrl(booking.bookingType);
            const travellerLabel = booking.travellers ? sanitizeText(booking.travellers) : '—';
            const confirmationRow = booking.confirmationData ? buildDetailRow('Confirmation', booking.confirmationData) : '';
            const notesRow = booking.notes ? buildDetailRow('Notes', booking.notes) : '';
            const detailsRow = buildDetailRow('Details', booking.details || 'Details to follow.');
            const typeMarker = iconUrl
                ? `<span class="booked-type-icon" style="background-color:${accent};-webkit-mask:url('${iconUrl}') center/contain no-repeat;mask:url('${iconUrl}') center/contain no-repeat;"></span>`
                : `<span class="booked-type-icon" style="background:${accent};display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:16px;color:#0f172a;">${emoji}</span>`;

            return `
                <details class="booked-card" style="border-left: 4px solid ${accent};">
                    <summary>
                        ${typeMarker}
                        <div>
                            <div>${sanitizeText(booking.headline || booking.bookingType || 'Booking')}</div>
                            <div class="booked-dates">${sanitizeText(formatDateRange(booking.startDate, booking.endDate))}</div>
                    </div>
                        <span class="booked-dates">${travellerLabel}</span>
                    </summary>
                    <div class="booked-body">
                        ${detailsRow}
                        ${confirmationRow}
                        ${notesRow}
                        <div class="booked-actions">
                            <button class="btn secondary" type="button" onclick="openBookedEditor('${booking.bookingId}')">Edit</button>
                            <button class="btn ghost" type="button" onclick="deleteBookedEntry('${booking.bookingId}')">Delete</button>
                        </div>
                    </div>
                </details>
            `;
        }

        function buildDetailRow(label, value) {
            if (!value) return '';
            return `<div><div class="label">${sanitizeText(label)}</div><div>${formatMultilineText(value)}</div></div>`;
        }

        function formatMultilineText(value) {
            return sanitizeText(value || '').replace(/\n/g, '<br>');
        }

        function formatDateRange(start, end) {
            if (!start && !end) return 'Dates TBC';
            if (!end || !start || start === end) {
                return formatLongDate(start || end);
            }
            return `${formatLongDate(start)} → ${formatLongDate(end)}`;
        }

        function compareByDeadlineThenCreated(a, b) {
            const aDeadline = parseDateValue(a.deadline);
            const bDeadline = parseDateValue(b.deadline);
            if (aDeadline !== bDeadline) return aDeadline - bDeadline;

            const aStart = parseDateValue(a.startDate);
            const bStart = parseDateValue(b.startDate);
            if (aStart !== bStart) return aStart - bStart;

            const aCreated = parseDateValue(a.createdAt) || 0;
            const bCreated = parseDateValue(b.createdAt) || 0;
            return aCreated - bCreated;
        }

        function compareByStartDate(a, b) {
            const aStart = parseDateValue(a.startDate);
            const bStart = parseDateValue(b.startDate);
            if (aStart !== bStart) return aStart - bStart;

            const typeWeight = (bookingType) => {
                const key = (bookingType || '').toString().trim().toLowerCase();
                switch (key) {
                    case 'flight':
                    case 'flights':
                    case 'flight/s':
                        return 0;
                    case 'ferry':
                        return 1;
                    case 'train':
                        return 2;
                    case 'hire car':
                    case 'hirecar':
                    case 'car hire':
                    case 'car':
                        return 3;
                    case 'accommodation':
                    case 'accommodation ':
                        return 4;
                    default:
                        return 5;
                }
            };

            const aWeight = typeWeight(a.bookingType);
            const bWeight = typeWeight(b.bookingType);
            if (aWeight !== bWeight) return aWeight - bWeight;

            return (a.headline || '').localeCompare(b.headline || '');
        }

        function parseDateValue(dateStr) {
            const date = parseISOToLocalDate(dateStr);
            return date ? date.getTime() : Number.POSITIVE_INFINITY;
        }

        function getTodayStart() {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            return today;
        }

        function sanitizeText(value) {
            return (value ?? '').toString()
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function sanitizeAttribute(value) {
            return (value ?? '').toString()
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;')
                .replace(/\n/g, '&#10;');
        }

        function formatIsoDate(date) {
            if (!(date instanceof Date) || isNaN(date)) return '';
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function normalizeDateInput(value) {
            if (!value && value !== 0) return '';

            if (value instanceof Date) {
                return formatIsoDate(value);
            }

            if (typeof value === 'number' && !Number.isNaN(value)) {
                const excelEpochOffset = 25569; // days between 1899-12-30 and 1970-01-01
                const msPerDay = 24 * 60 * 60 * 1000;
                const date = new Date(Math.round((value - excelEpochOffset) * msPerDay));
                return formatIsoDate(date);
            }

            if (typeof value === 'string') {
                const trimmed = value.trim();
                if (!trimmed) return '';

                const isoMatch = trimmed.match(/^(\d{4})-(\d{2})-(\d{2})/);
                if (isoMatch) {
                    return `${isoMatch[1]}-${isoMatch[2]}-${isoMatch[3]}`;
                }

                const parsed = new Date(trimmed);
                if (!isNaN(parsed)) {
                    return formatIsoDate(parsed);
                }
            }

            return '';
        }

        function updateCalendar() {
            const calendarGrid = document.getElementById('calendarGrid');
            const currentMonthElement = document.getElementById('currentMonth');
            if (!calendarGrid || !currentMonthElement) return;

            currentMonthElement.textContent = currentMonth.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
            calendarGrid.innerHTML = '';

            const dayHeaders = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
            dayHeaders.forEach(day => {
                const header = document.createElement('div');
                header.textContent = day;
                header.style.fontWeight = 'bold';
                header.style.background = 'rgba(148, 163, 184, 0.2)';
                header.style.padding = '10px 5px';
                header.style.textAlign = 'center';
                calendarGrid.appendChild(header);
            });

            const firstDay = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);
            const lastDay = new Date(currentMonth.getFullYear(), currentMonth.getMonth() + 1, 0);
            const daysInMonth = lastDay.getDate();
            const startingDay = firstDay.getDay();

            for (let i = 0; i < startingDay; i++) {
                const emptyDay = document.createElement('div');
                emptyDay.className = 'calendar-day other-month';
                calendarGrid.appendChild(emptyDay);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dayElement = document.createElement('div');
                dayElement.className = 'calendar-day';
                
                const currentDate = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), day);
                if (currentDate.getTime() === getTodayStart().getTime()) {
                    dayElement.classList.add('today');
                }

                dayElement.innerHTML = `<div>${day}</div>${getDayIndicators(currentDate)}`;
                calendarGrid.appendChild(dayElement);
            }

            attachCalendarTooltipHandlers();
        }

        function getDayIndicators(date) {
            return getTravelIndicatorsForDate(date) + getBookingIndicatorsForDate(date);
        }

        function getTravelIndicatorsForDate(date) {
            if (!Array.isArray(currentData.relationshipLog) || currentData.relationshipLog.length === 0) {
                return '';
            }

            const dateStr = date.toLocaleDateString('en-GB');
            const dayTravel = currentData.relationshipLog.find(entry => entry[0] === dateStr);
            if (!dayTravel) return '';

            const [, kimberCountry, sionaCountry] = dayTravel;
            let indicators = '';

            if (kimberCountry && sionaCountry) {
                if (kimberCountry === sionaCountry) {
                    indicators += '<div class="travel-indicator both"></div>';
                } else {
                    indicators += '<div class="travel-indicator kimber"></div>';
                    indicators += '<div class="travel-indicator siona"></div>';
                }
            } else if (kimberCountry) {
                indicators += '<div class="travel-indicator kimber"></div>';
            } else if (sionaCountry) {
                indicators += '<div class="travel-indicator siona"></div>';
            }

            return indicators;
        }

        function isDateWithinRange(targetIso, startIso, endIso) {
            if (!targetIso) return false;
            const target = parseISOToLocalDate(targetIso);
            const start = parseISOToLocalDate(startIso || targetIso);
            const end = parseISOToLocalDate(endIso || startIso || targetIso);
            if (!target || !start || !end) return false;

            const targetValue = target.getTime();
            return targetValue >= start.getTime() && targetValue <= end.getTime();
        }

        function previousMonth() {
            currentMonth.setMonth(currentMonth.getMonth() - 1);
            updateCalendar();
        }

        function nextMonth() {
            currentMonth.setMonth(currentMonth.getMonth() + 1);
            updateCalendar();
        }

        // Future Tab Functions
        function loadFutureTab() {
            console.log('🔄 Loading Future tab...');
            console.log('FutureScenarios data:', currentData.futureScenarios?.length || 0, 'entries');
            
            const scenarioList = document.getElementById('scenarioList');
            if (scenarioList) {
                scenarioList.innerHTML = '';

                // Group scenarios by scenario ID
                const scenarioGroups = {};
                currentData.futureScenarios.forEach(scenario => {
                const [scenarioId, createdBy, scenarioName, sectionId, startDate, endDate, kimberCountry, sionaCountry, kimberCities, sionaCities, kimberAccommodation, sionaAccommodation, kimberNotes, sionaNotes, coordinationNotes] = scenario;
                
                if (!scenarioGroups[scenarioId]) {
                    scenarioGroups[scenarioId] = {
                        id: scenarioId,
                        createdBy: createdBy,
                        name: scenarioName,
                        sections: []
                    };
                }
                
                scenarioGroups[scenarioId].sections.push({
                    sectionId,
                    startDate,
                    endDate,
                    kimberCountry,
                    sionaCountry,
                    kimberCities,
                    sionaCities,
                    kimberAccommodation,
                    sionaAccommodation,
                    kimberNotes,
                    sionaNotes,
                    coordinationNotes
                });
            });

            // Create scenario cards
            Object.values(scenarioGroups).forEach(scenario => {
                const scenarioCard = createScenarioCard(scenario);
                scenarioList.appendChild(scenarioCard);
            });
            } else {
                console.error('❌ scenarioList element not found');
            }
        }

        function createScenarioCard(scenario) {
            const card = document.createElement('div');
            card.className = 'scenario-card';

            card.innerHTML = `
                <div class="scenario-header">
                    <div class="scenario-title">${sanitizeText(scenario.name)}</div>
                    <div class="scenario-created">Created by ${sanitizeText(scenario.createdBy)}</div>
                </div>
                <div class="scenario-sections">
                    ${scenario.sections.map(section => `
                        <div class="section-item ${section.kimberCountry === section.sionaCountry ? '' : 'separate'}">
                            <div class="section-dates">${sanitizeText(section.startDate)} - ${sanitizeText(section.endDate)}</div>
                            <div class="section-countries">
                                ${section.kimberCountry === section.sionaCountry ? 
                                    `Together in ${sanitizeText(section.kimberCountry)}` : 
                                    `Kimber: ${sanitizeText(section.kimberCountry)} | Siona: ${sanitizeText(section.sionaCountry)}`
                                }
                            </div>
                            <div class="section-notes">${sanitizeText(section.coordinationNotes)}</div>
                        </div>
                    `).join('')}
                </div>
            `;

            return card;
        }

        function createScenario() {
            // In a real app, this would open a modal or form to create a new scenario
            showStatus('Scenario creation feature coming soon!', 'loading');
        }

        // Utility functions
        function formatDate(date) {
            return date.toLocaleDateString('en-GB');
        }

        function parseDate(dateStr) {
            if (!dateStr) return new Date();
            
            // Handle different date formats
            if (dateStr.includes('/')) {
                // DD/MM/YYYY format
                const parts = dateStr.split('/');
                return new Date(parts[2], parts[1] - 1, parts[0]);
            } else if (dateStr.includes('-')) {
                // YYYY-MM-DD format
                return new Date(dateStr);
            } else {
                // Fallback to direct parsing
                return new Date(dateStr);
            }
        }
    </script>
